title = "lead-flow-automation gitleaks config"

[extend]
useDefault = true

# Test files and the CI workflow use obviously fake throwaway secrets ("test-secret-0123456789",
# the compose smoke test's keys) that the generic-api-key entropy rule flags. Only that rule, only there.
[[allowlists]]
description = "fake secrets in tests and CI"
targetRules = ["generic-api-key"]
paths = ['''^test/''', '''^\.github/workflows/ci\.yml$''']
