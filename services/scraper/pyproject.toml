[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "leadflow-scraper"
version = "0.1.0"
description = "Polite, allow-listed scraper for practice sites: robots.txt, rate limit and disk cache."
license = "MIT"
authors = [{ name = "DC TECH INC" }]
requires-python = ">=3.12"
dependencies = ["requests==2.34.2", "beautifulsoup4==4.15.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.17.1"]

[project.scripts]
leadflow-scraper = "leadflow_scraper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=leadflow_scraper --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
omit = ["*/__main__.py"]
