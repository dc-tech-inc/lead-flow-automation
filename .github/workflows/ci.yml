name: CI

# Core checks (node, scraper, gitleaks) run on pull requests and on pushes to main, so main always has a run.
# Heavy jobs (n8n import, compose smoke, e2e) run on pull requests and manual dispatch only, to spare private Actions minutes.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway credentials for an ephemeral CI container.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: leadflow_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/leadflow_test

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build

  scraper:
    name: Scraper (ruff, pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/scraper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/scraper/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  n8n-import:
    name: n8n imports the workflows
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Import into a real n8n container and list the result
        run: |
          docker run --rm --entrypoint sh             -e N8N_ENCRYPTION_KEY=ci-only-not-a-secret             -v "$PWD/n8n/workflows:/workflows:ro"             n8nio/n8n:2.45.2             -c 'n8n import:workflow --separate --input=/workflows && n8n list:workflow' | tee import.log
          for name in "Lead intake" "Lead follow-up" "Slow response alert"; do
            grep -q "$name" import.log
          done

  compose:
    name: Compose stack smoke test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WEBHOOK_SECRET: ci-compose-webhook-secret-0123456789
      N8N_ENCRYPTION_KEY: ci-compose-n8n-key-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Start PostgreSQL and the service
        run: docker compose up -d --build --wait service
      - name: Signed events end to end
        run: node scripts/smoke.mjs
      - name: n8n boots with the imported workflows
        run: |
          docker compose up -d n8n
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5678/healthz && break; sleep 5; done
          curl -sf http://127.0.0.1:5678/healthz
          docker compose logs n8n-import | grep -i "imported"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v

  e2e:
    name: Dashboard in a headless browser
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-screenshot
          path: docs/dashboard.png

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan the full history
      - name: Download gitleaks and verify its sha256
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $tarball\$" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
      - run: ./gitleaks git --redact --verbose .
